# PhysGround conda environment.
#
#   conda env create -f env.yml && conda activate physground
#   pip install -e .
#
# Python is pinned to 3.11 to match the Modal image (spec 17.5) so that the
# local, SLURM, and Modal paths all execute identical bytecode-level behaviour.
#
# Rendering note (spec 17.1): MUJOCO_GL is deliberately NOT set here. It must be
# chosen per host and exported before `import mujoco`; scripts/preflight_render.py
# is what verifies the choice actually took effect.
name: physground
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Software OpenGL for headless CPU rendering. On a GPU node with an NVIDIA
  # EGL vendor ICD you can ignore these and export MUJOCO_GL=egl instead.
  - mesalib
  - pip:
      - mujoco>=3.1
      - numpy>=1.26
      - scipy>=1.11
      - scikit-learn>=1.3
      - Pillow>=10.0
      - matplotlib>=3.8
      - PyOpenGL>=3.1
      - torch>=2.1
      - torchvision>=0.16
      # Video encoders (spec 7.1). Only needed for Experiment F; the DINOv2 and
      # random-init path through Experiment E does not import transformers.
      - transformers>=4.44
      # Optional, for the Modal deployment path (spec 17.5).
      - modal>=0.64
