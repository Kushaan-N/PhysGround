[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physground"
version = "0.1.0"
description = "What physical state do frozen visual encoders actually encode?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "Pillow>=10.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Feature extraction. Separated so corpus-generation workers, which never touch
# a GPU (spec 17.2), do not pull torch into a CPU container.
encoders = ["torch>=2.1", "torchvision>=0.16"]
# Video encoders for Experiment F only.
video = ["transformers>=4.44"]
modal = ["modal>=0.64"]

[tool.setuptools.packages.find]
include = ["physground*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
